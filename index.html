<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <div class="display">
            <div class="expression" id="expression">0</div>
            <div class="result" id="result">0</div>
        </div>

        <div class="buttons">

            <button class="clear" onclick="clearCalculator()">AC</button>
            <button onclick="deleteLast()">DEL</button>
            <button onclick="addValue('(')">(</button>
            <button onclick="addValue(')')">)</button>

            <button onclick="addValue('7')">7</button>
            <button onclick="addValue('8')">8</button>
            <button onclick="addValue('9')">9</button>
            <button class="operator" onclick="addValue('/')">÷</button>

            <button onclick="addValue('4')">4</button>
            <button onclick="addValue('5')">5</button>
            <button onclick="addValue('6')">6</button>
            <button class="operator" onclick="addValue('*')">×</button>

            <button onclick="addValue('1')">1</button>
            <button onclick="addValue('2')">2</button>
            <button onclick="addValue('3')">3</button>
            <button class="operator" onclick="addValue('-')">−</button>

            <button onclick="addValue('0')">0</button>
            <button onclick="addValue('.')">.</button>
            <button onclick="addValue('%')">%</button>
            <button class="operator" onclick="addValue('+')">+</button>

            <button onclick="squareRoot()">√</button>
            <button onclick="squareNumber()">x²</button>

            <button class="equals wide" onclick="calculate()">=</button>

        </div>

        <div class="history">
            <h3>History</h3>

            <div class="history-list" id="history">
                No calculations yet.
            </div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
